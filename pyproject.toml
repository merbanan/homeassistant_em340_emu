[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "em340-emu"
version = "0.1.0"
description = "Carlo Gavazzi EM340 Modbus meter emulator for RS485-to-Ethernet gateways (e.g. towards a Wallbox charger)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Benjamin Larsson" }]
dependencies = ["paho-mqtt>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[project.scripts]
em340-emu = "em340_emu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/em340_emu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
# pytest-homeassistant-custom-component (needed only for
# custom_components/em340_emu/tests) registers itself as a global plugin and
# unconditionally blocks real sockets for every test in the environment if
# loaded, which breaks this package's own asyncio server tests. Keep it out
# of the default run; the HA suite re-enables it explicitly (see its own
# README note).
addopts = "-p no:homeassistant"
